<!DOCTYPE html>
<html>
<head>
    <title>Auditoría de Resultados ONPE</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f4f4f4; }
        iframe { width: 100%; height: 100%; border: none; }
        #mensaje { position: fixed; bottom: 0; width: 100%; background: red; color: white; text-align: center; font-weight: bold; padding: 5px; }
    </style>
</head>
<body>
    <div id="mensaje">DEMOSTRACIÓN DE VULNERABILIDAD VISUAL - NIVEL AUDITORÍA</div>
    
    <iframe id="onpe" src="https://api.codetabs.com/v1/proxy/?quest=https://resultadoelectoral.onpe.gob.pe/main/senadores-distrito-nacional-unico" style="width:100%; height:100vh;"></iframe>

    <script>
        const frame = document.getElementById('onpe');
        
        setInterval(() => {
            try {
                const doc = frame.contentDocument || frame.contentWindow.document;
                if (!doc) return;

                const filas = doc.querySelectorAll('tr, div[role="row"]');
                filas.forEach(fila => {
                    if (fila.innerText.toUpperCase().includes("VILLANUEVA CARBAJAL")) {
                        fila.querySelectorAll('td, span, div, b').forEach(el => {
                            // Cambiamos el número de votos
                            if (/^\s*\d{1,3}(,\d{3})*\s*$/.test(el.innerText)) {
                                if(el.innerText.trim() !== "90,000") el.innerText = "90,000";
                            }
                            // Cambiamos el porcentaje
                            if (el.innerText.includes('%')) el.innerText = "95.000 %";
                        });
                        // Estiramos la barra visual
                        const barra = fila.querySelector('.progress-bar, [class*="bar"]');
                        if (barra) barra.style.width = '95%';
                    }
                });
            } catch (e) {
                // El error de "en blanco" es porque el navegador aún bloquea el acceso al contenido interno
            }
        }, 300);
    </script>
</body>
</html>
